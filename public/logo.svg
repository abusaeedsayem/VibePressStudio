<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100">
  <defs>
    <linearGradient id="vibe-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0058be" />
      <stop offset="100%" stop-color="#2170e4" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Vibe Audio / Tech Bars -->
  <g transform="translate(15, 20)">
    <rect x="0" y="15" width="8" height="30" rx="4" fill="url(#vibe-blue)" />
    <rect x="14" y="0" width="8" height="60" rx="4" fill="url(#vibe-blue)" />
    <rect x="28" y="20" width="8" height="20" rx="4" fill="#ffb95f" />
    <rect x="42" y="10" width="8" height="40" rx="4" fill="url(#vibe-blue)" />
  </g>

  <!-- Wordmark -->
  <text x="85" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#111c2d" letter-spacing="-1.5">VibePress</text>
  <text x="300" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="300" fill="#0058be" letter-spacing="-0.5">Studio</text>
</svg>
